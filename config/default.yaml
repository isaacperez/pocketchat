# Runtime
seed: 42
device: auto

# Training Schedule
steps: 100000 
log_every: 100
save_every: 5000
val_every: 5000
show_val_completion: true
val_completion_chars: 60
val_completion_max_prompt_chars: 120
val_completion_decoding: greedy
val_completion_temperature: 1.0
val_completion_top_k: 0

# Optimization
learning_rate: 0.00001
weight_decay: 0.0
loss_horizon_decay: 0.8
warmup_steps: 500
min_lr_ratio: 0.05
grad_clip_norm: 1.0

# Data
batch_size: 64
min_seq_len: 16
max_seq_len: 512
max_chars: 0
stride: 1
drop_last: false
num_workers: 0
pin_memory: false
vocab_size: 256
val_split: 0.01
val_max_batches: 0

# Model: Core Dimensions
embedding_dim: 16
hidden_state_dim: 64
num_next_chars: 1
hypothesis_dim: 32
observation_dim: 32
updated_hypothesis_dim: 32

# Model: Iterative Reasoning
num_hypotheses: 4
num_parts: 4
window_size: 64
num_iterations: 8

# Numerical Stability
matcher_eps: 0.00000001
